<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác nhận tài khoản</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #eef6ff; text-align: center; }
    .card { background: #fff; padding: 32px 24px; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); max-width: 400px; width: 85%; }
    h2 { color: #16a34a; margin-top: 0; }
    p { color: #334155; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Đăng ký tài khoản thành công!</h2>
    <p>Email của bạn đã được xác thực. Hãy đóng trang này và quay lại ứng dụng <b>UIT Chat App</b> để đăng nhập.</p>
  </div>
</body>
</html>
